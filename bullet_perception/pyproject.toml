[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullet-perception"
version = "0.1.0"
description = "Reusable Bullet image perception utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "opencv-python>=4.10,<5"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
