[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullet-view"
version = "0.1.0"
description = "MAVLink telemetry viewer for Bullet flight simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymavlink>=2.4,<3",
    "pyside6-essentials>=6.8,<7",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.scripts]
bullet-view = "bullet_view.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
