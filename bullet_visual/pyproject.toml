[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullet-visual"
version = "0.1.0"
description = "Configurable camera capture and bounding-box publisher for Bullet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["bullet-msgs", "bullet-perception", "click>=8.5,<9", "loguru>=0.7,<1", "numpy>=2,<3", "opencv-python>=4.10,<5", "pyzmq>=27,<28", "pyyaml>=6,<7", "jsonschema>=4,<5"]

[project.scripts]
bullet-visual = "bullet_visual.main:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv.sources]
bullet-msgs = { workspace = true }
bullet-perception = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
